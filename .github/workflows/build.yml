name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Giai nen du an
        run: |
          mkdir app
          unzip -q project.zip -d app
      - name: Cai thu vien va build web
        working-directory: app
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx vite build
          mkdir -p dist/pyodide
          cp -r node_modules/pyodide/. dist/pyodide/
      - name: Tao du an Android va build APK
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pydroid3-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
